name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Tcl and browser tools
        run: |
          # Use the signed official archive when the runner's Azure mirror cannot resolve.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if ! timeout 10 getent ahostsv4 archive.ubuntu.com >/dev/null; then
            ci_iface=$(ip route show default | awk '{for(i=1;i<NF;i++) if($i=="dev") {print $(i+1); exit}}')
            test -n "$ci_iface"
            sudo resolvectl dns "$ci_iface" 1.1.1.1 8.8.8.8
            sudo resolvectl flush-caches
          fi
          sudo apt-get update
          sudo apt-get install -y tcl8.6 tcllib
          npm ci
          npx playwright install --with-deps chromium
      - name: Offline regression
        run: python3 tests/run.py --tcl86 tclsh8.6 --browser --output /tmp/decent-remote-tests.json
      - name: Build install archive
        run: python3 tools/build_release.py
      - name: Offline usage statistics checks
        run: |
          node --test statistics/tests/worker.test.mjs
          tclsh8.6 statistics/tests/client.test.tcl
          python3 statistics/tests/export.test.py
          node --test statistics/tests/site.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: review-artifacts
          path: |
            dist/*.zip
            /tmp/decent-remote-tests.json
