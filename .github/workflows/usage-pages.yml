name: Usage by country
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: usage-pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ vars.USAGE_SUMMARY_URL != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Fetch public country totals
        env:
          SUMMARY_URL: ${{ vars.USAGE_SUMMARY_URL }}
        run: python3 statistics/tools/export_summary.py --url "$SUMMARY_URL"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: statistics/site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish country totals
        id: deployment
        uses: actions/deploy-pages@v4
