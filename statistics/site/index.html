<!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://chowjw-vibecode.github.io/usage-stats/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decent tools · Usage</title>
<style>
:root{color-scheme:dark light;--bg:#141719;--panel:#1b1f22;--text:#eeeade;--muted:#a3adac;--accent:#8dc7b7;--line:#343c3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:900px;margin:0 auto;padding:48px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px}header strong{letter-spacing:-.5px;font-size:21px}button{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 15px;cursor:pointer}h1{font-size:clamp(30px,5vw,44px);font-weight:550;line-height:1.2;letter-spacing:-1px;margin:40px 0 12px}p,small{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:32px 0}.card{background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:9px}.card strong{display:block;font-size:36px;line-height:1.4;font-weight:500;font-variant-numeric:tabular-nums}.card span{font-size:13px;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:16px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left;width:60%}th{font-size:12px;font-weight:500;color:var(--muted)}.bar{height:3px;margin-top:9px;background:var(--line);max-width:90%}.bar i{display:block;height:100%;background:var(--accent)}#message{padding:30px 0}footer{margin-top:32px;font-size:13px;color:var(--muted)}@media(max-width:550px){main{padding:24px 16px}.cards{gap:8px}.card{padding:12px}.card strong{font-size:28px}.card span{font-size:11px}}
label{display:flex;align-items:center;gap:12px;margin-top:24px;color:var(--muted);font-size:14px}select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:7px;min-height:44px;padding:8px 36px 8px 12px}select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#message:empty{display:none}
</style><main><header><strong>Decent Remote · This Cup</strong><button id="language" type="button">中文</button></header><h1 id="title"></h1><p id="intro"></p><label for="product"><span id="product-label"></span><select id="product"><option value="all"></option><option value="decent_remote">Decent Remote</option><option value="this_cup"></option></select></label><div class="cards"><div class="card"><strong id="total">—</strong><span id="total-label"></span></div><div class="card"><strong id="active">—</strong><span id="active-label"></span></div><div class="card"><strong id="regions">—</strong><span id="regions-label"></span></div></div><p id="message" role="status"></p><table id="table" hidden><thead><tr><th id="country-label"></th><th id="count-label"></th><th id="recent-label"></th></tr></thead><tbody id="rows"></tbody></table><footer><div id="updated"></div><div id="note"></div></footer></main>
<script src="./app.js"></script></html>
