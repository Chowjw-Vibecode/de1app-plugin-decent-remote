<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decent Remote · Usage</title>
<style>
:root{color-scheme:dark light;--bg:#141719;--panel:#1b1f22;--text:#eeeade;--muted:#a3adac;--accent:#8dc7b7;--line:#343c3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:900px;margin:0 auto;padding:48px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px}header strong{letter-spacing:-.5px;font-size:21px}button{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 15px;cursor:pointer}h1{font-size:clamp(30px,5vw,44px);font-weight:550;line-height:1.2;letter-spacing:-1px;margin:40px 0 12px}p,small{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:32px 0}.card{background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:9px}.card strong{display:block;font-size:36px;line-height:1.4;font-weight:500;font-variant-numeric:tabular-nums}.card span{font-size:13px;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:16px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left;width:60%}th{font-size:12px;font-weight:500;color:var(--muted)}.bar{height:3px;margin-top:9px;background:var(--line);max-width:90%}.bar i{display:block;height:100%;background:var(--accent)}#message{padding:30px 0}footer{margin-top:32px;font-size:13px;color:var(--muted)}@media(max-width:550px){main{padding:24px 16px}.cards{gap:8px}.card{padding:12px}.card strong{font-size:28px}.card span{font-size:11px}}
</style><main><header><strong>Decent Remote</strong><button id="language" type="button">中文</button></header><h1 id="title"></h1><p id="intro"></p><div class="cards"><div class="card"><strong id="total">—</strong><span id="total-label"></span></div><div class="card"><strong id="active">—</strong><span id="active-label"></span></div><div class="card"><strong id="regions">—</strong><span id="regions-label"></span></div></div><p id="message" role="status"></p><table id="table" hidden><thead><tr><th id="country-label"></th><th id="count-label"></th><th id="recent-label"></th></tr></thead><tbody id="rows"></tbody></table><footer><div id="updated"></div><div id="note"></div></footer></main>
<script>
let language='en',data=null,failed=false;
const $=id=>document.getElementById(id),words={en:{title:'Used around the world',intro:'Country and region totals for Decent Remote installations.',total:'Installations counted',active:'Active in 30 days',regions:'Countries / regions',country:'Country / region',count:'Total',recent:'Active · 30d',pending:'Statistics are not available yet.',empty:'No installations have been counted yet.',failed:'Statistics could not be loaded. Please try again later.',updated:'Updated',note:'Counts represent installations, not people. VPNs and reinstalls can affect the figures.',unknown:'Unknown'},zh:{title:'各地都在用',intro:'Decent Remote 按国家和地区汇总的安装数量。',total:'已统计安装',active:'近 30 天活跃',regions:'国家／地区',country:'国家／地区',count:'安装数',recent:'近 30 天活跃',pending:'统计暂未上线。',empty:'目前还没有安装统计。',failed:'暂时无法读取统计，请稍后再试。',updated:'更新于',note:'统计的是安装数量，不是人数。VPN 和重新安装可能影响结果。',unknown:'未知'}};
function render(){const w=words[language];document.documentElement.lang=language==='en'?'en':'zh-CN';$('language').textContent=language==='en'?'中文':'English';$('title').textContent=w.title;$('intro').textContent=w.intro;for(const [id,key]of Object.entries({'total-label':'total','active-label':'active','regions-label':'regions','country-label':'country','count-label':'count','recent-label':'recent','note':'note'}))$(id).textContent=w[key];$('rows').replaceChildren();$('table').hidden=true;$('updated').textContent='';for(const id of ['total','active','regions'])$(id).textContent='—';if(failed){$('message').textContent=w.failed;return}if(!data||data.status==='not_deployed'){$('message').textContent=w.pending;return}
$('total').textContent=data.total_installations.toLocaleString();$('active').textContent=data.active_30d.toLocaleString();$('regions').textContent=data.countries.filter(r=>r.country!=='ZZ'&&r.installations>0).length;$('message').textContent=data.countries.length?'':w.empty;$('table').hidden=!data.countries.length;let names;try{names=new Intl.DisplayNames([language],{type:'region'})}catch{};const max=Math.max(1,...data.countries.map(r=>r.installations));for(const r of data.countries){const tr=document.createElement('tr'),name=document.createElement('td'),total=document.createElement('td'),active=document.createElement('td');name.textContent=r.country==='ZZ'?w.unknown:(names?.of(r.country)||r.country);const bar=document.createElement('div'),fill=document.createElement('i');bar.className='bar';fill.style.width=(100*r.installations/max)+'%';bar.append(fill);name.append(bar);total.textContent=r.installations.toLocaleString();active.textContent=r.active_30d.toLocaleString();tr.append(name,total,active);$('rows').append(tr)}$('updated').textContent=w.updated+' '+new Date(data.generated_at).toLocaleString(language==='en'?'en-GB':'zh-CN')}
$('language').onclick=()=>{language=language==='en'?'zh':'en';render()};render();fetch('./data.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('unavailable');return r.json()}).then(d=>{if(d.status!=='not_deployed'&&(!Array.isArray(d.countries)||!Number.isInteger(d.total_installations)||!Number.isInteger(d.active_30d)))throw Error('invalid');data=d;render()}).catch(()=>{failed=true;render()});
</script></html>
