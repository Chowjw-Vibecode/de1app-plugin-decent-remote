.theme-button{width:44px;min-width:44px;display:flex;align-items:center;justify-content:center;padding:8px;color:var(--muted);border-color:transparent}
nav button:not(.active):hover{background:#1d2325;border-color:transparent}
html[data-theme=light]{color-scheme:light;--bg:#f2f3ef;--panel:#fff;--raised:#e8ebe6;--line:#d5dbd4;--text:#202d27;--muted:#68736b;--accent:#2c795e;--accent-dark:#e2efe8;--amber:#90641c;--danger:#b24e40;--temp:#ff97a1;--cupflow:#e9d3c3;--weight:#997e57}
html[data-theme=light] button:hover:not(:disabled){background:#e7ece5;border-color:#a7b8ab}
html[data-theme=light] .primary{color:#fff}html[data-theme=light] .primary:hover:not(:disabled){background:#23674e;border-color:#23674e}
html[data-theme=light] .danger{border-color:#d8b6ac}
html[data-theme=light] .top-status{color:var(--muted)}
html[data-theme=light] .demo-tag{color:#7b6334;border-color:#cfbea1}
html[data-theme=light] nav button.active,html[data-theme=light] .favorites button.chosen,html[data-theme=light] .chips button.active{background:#e2eee5;color:var(--accent);border-color:#aec9b6}
html[data-theme=light] nav button:not(.active):hover{background:#e8ece6;border-color:transparent}
html[data-theme=light] .stepper,html[data-theme=light] .field input,html[data-theme=light] .field select,html[data-theme=light] .field textarea,html[data-theme=light] .setting-row input:not([type=checkbox]),html[data-theme=light] .setting-row select,html[data-theme=light] .keypad-display{background:#f6f8f3}
html[data-theme=light] .editor-footer{background:#fff}
html[data-theme=light] .list-item{border-color:#e0e5de}
html[data-theme=light] .list-item.active,html[data-theme=light] .group-nav button.active{background:#e3eee6}
html[data-theme=light] .setting-row{border-color:#e0e5de}
html[data-theme=light] .tag.good{background:#e0eee5;color:#2c795e}
html[data-theme=light] .tag.draft{background:#f3ead8;color:#80601f}
html[data-theme=light] .legend button{color:#66716b}
html[data-theme=light] .chart text{fill:#748078}
html[data-theme=light] .toggle:before{background:#c7cec7}
html[data-theme=light] .toggle:after{background:#fff}

html[data-theme=light] .toggle[aria-checked=true]:after{background:#fff}

<body>
<header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>Decent <span style="font-weight:400;color:var(--muted)">Remote</span></div><span class="tag demo-tag">远程控制</span><span class="top-status"><i class="dot"></i><span id="machine-state">待机</span></span><span class="top-spacer"></span><button class="quiet small" id="connect-button">连接</button><button class="theme-button" id="theme-button" aria-label="切换浅色" title="切换浅色"></button><button class="language-button" id="language-button" aria-label="Switch language"><span data-lang-option="zh" class="selected">中</span><span class="lang-divider">/</span><span data-lang-option="en">EN</span></button></header>

const importError=key=>{throw new Error(key)};
const shownNumber=n=>n==null?'—':n;
function tclList(text){
 const result=[];let i=0;

  i++;if(i>=text.length)importError('文件格式不完整。');
  const c=text[i++],simple={n:'\n',r:'\r',t:'\t',f:'\f',v:'\v',a:'\x07',b:'\b'};
  if(c==='\n'){while(/[ \t]/.test(text[i]||'\0'))i++;return ' '}
  if(c in simple)return simple[c];
  const pattern=c==='x'?/^[0-9a-fA-F]{1,2}/:c==='u'?/^[0-9a-fA-F]{1,4}/:c==='U'?/^[0-9a-fA-F]{1,8}/:null;

  if(/[0-7]/.test(c)){const m=(c+text.slice(i)).match(/^[0-7]{1,3}/)[0];i+=m.length-1;return String.fromCharCode(parseInt(m,8))}
  return c;
 }
 while(i<text.length){
  while(/\s/.test(text[i]||'\0'))i++;if(i>=text.length)break;
  let word='';
  if(text[i]==='{'){
   i++;let depth=1;
   while(i<text.length&&depth){
    const c=text[i++];
    if(c==='\\'){
     if(i>=text.length)importError('文件格式不完整。');
     if(text[i]==='\n'){i++;while(/[ \t]/.test(text[i]||'\0'))i++;word+=' '}
     else word+=c+text[i++];
    }else if(c==='{'){if(++depth>32)importError('文件嵌套过深。');word+=c}
    else if(c==='}'){if(--depth)word+=c}
    else word+=c;
   }
   if(depth)importError('文件格式不完整。');
   if(i<text.length&&!/\s/.test(text[i]))importError('文件格式不完整。');
  }else if(text[i]==='"'){
   i++;let closed=false;
   while(i<text.length){if(text[i]==='"'){i++;closed=true;break}word+=text[i]==='\\'?escape():text[i++]}
   if(!closed||(i<text.length&&!/\s/.test(text[i])))importError('文件格式不完整。');
  }else{while(i<text.length&&!/\s/.test(text[i]))word+=text[i]==='\\'?escape():text[i++]}
  result.push(word);if(result.length>12000)importError('文件参数过多。');

}

 if(typeof value!=='number'&&typeof value!=='string')importError('曲线含有无效数值。');
 if(typeof value==='string'&&!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(value.trim()))importError('曲线含有无效数值。');

function importText(value,fallback=''){if(value==null)return fallback;if(typeof value!=='string'||value.length>512)importError('曲线名称或分段名称无效。');return value.trim()||fallback}
function normalizeImportedProfile(text,filename){

 if(new TextEncoder().encode(text).length>1048576)importError('文件超过 1 MB，请选择单条曲线。');

}

function rememberedKey(){try{return localStorage.getItem(rememberedKeyName)||''}catch{return ''}}

const translationsByLength=Object.entries(languageCatalog).sort((a,b)=>b[0].length-a[0].length);
function displayTranslation(text){
 if(language==='zh')return text;
 let out=text.replace(/(\d+) 条记录/g,(_,n)=>n+' '+(n==='1'?'shot':'shots')).replace(/(\d+) 段/g,(_,n)=>n+' '+(n==='1'?'stage':'stages'));
 for(const [source,target] of translationsByLength)out=out.split(source).join(target);
 return out;
}
function translateUI(){
 languageObserver.disconnect();
 $$('[data-stage-label]').forEach(el=>el.textContent=stageLabel(el.dataset.stageLabel));
 document.documentElement.lang=language==='en'?'en':'zh-CN';
 const walker=document.createTreeWalker(document.documentElement,NodeFilter.SHOW_TEXT);
 while(walker.nextNode()){
  const n=walker.currentNode,parent=n.parentElement;
  if(!parent||parent.closest('script,style,textarea,#language-button,[data-favorite-slot] option:not([value=""]),[data-verbatim]'))continue;
  const old=originalText.get(n);
  const source=old&&n.nodeValue===old.display?old.source:n.nodeValue;
  const display=displayTranslation(source);
  originalText.set(n,{source,display});
  if(n.nodeValue!==display)n.nodeValue=display;
 }
 document.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>{
  if(el.id==='language-button'||el.closest('[data-verbatim]'))return;
  let record=originalAttributes.get(el)||{};
  for(const attr of ['placeholder','aria-label','title']){
   if(!el.hasAttribute(attr)||(attr==='title'&&el.matches('[data-fav]')&&el.dataset.fav))continue;
   const value=el.getAttribute(attr),old=record[attr];
   const source=old&&value===old.display?old.source:value;
   const display=displayTranslation(source);
   record[attr]={source,display};if(value!==display)el.setAttribute(attr,display);
  }
  originalAttributes.set(el,record);
 });
 document.querySelectorAll('[data-lang-option]').forEach(el=>el.classList.toggle('selected',el.dataset.langOption===language));
 languageObserver.observe(document.documentElement,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']});
}
const languageObserver=new MutationObserver(translateUI);
$('#language-button').onclick=()=>{language=language==='zh'?'en':'zh';localStorage.setItem('decent-remote-language',language);translateUI();requestAnimationFrame(()=>{drawCharts();translateUI()})};
